[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deeppaper"
version = "0.1.0"
description = "Automated academic paper discovery, screening, and deep-reading pipeline — push to Obsidian"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Leo", email = "lyfleo325@gmail.com" },
]
keywords = [
    "academic-papers",
    "arxiv",
    "semantic-scholar",
    "openreview",
    "literature-review",
    "obsidian",
    "deep-reading",
    "paper-automation",
    "research-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "PyYAML>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/lyfleo325/deeppaper"
Repository = "https://github.com/lyfleo325/deeppaper"
Issues = "https://github.com/lyfleo325/deeppaper/issues"

[project.scripts]
deeppaper = "deeppaper.cli:cli"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.package-data]
deeppaper = ["config.yaml"]

[tool.setuptools.packages.find]
where = ["src"]
