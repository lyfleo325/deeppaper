# ============================================================
# Paper Automation Configuration
# 论文自动化筛选 & 精读 & Obsidian推送 配置
# ============================================================

schedule:
  # 运行时间 (Asia/Shanghai)
  days: [Monday, Thursday]
  hour: 11
  minute: 0

# Obsidian知识库路径
obsidian:
  kb_root: "C:\\Users\\Leo\\Desktop\\KB"
  daily_dir: "Daily"
  projects:
    PhysBrain: "Projects\\PhysBrain"
    能量原理: "Projects\\能量原理"
    科研智能体: "Projects\\科研智能体"
    多模态: "Projects\\多模态"
    AI算力集群: "Projects\\AI算力集群"
  mocs:
    智能体: "MOCs\\智能体.md"
    全部论文: "MOCs\\全部论文.md"

# 每次每个方向推荐的论文数
papers_per_direction: 2

