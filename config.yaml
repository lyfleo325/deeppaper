# ============================================================
# API Sources
# ============================================================
sources:
  arxiv:
    enabled: true
    base_url: "https://export.arxiv.org/api/query"
    max_results_per_query: 10
    categories:
      - "cs.AI"
      - "cs.LG"
      - "cs.CL"
      - "cs.CV"
      - "cs.RO"
      - "cs.AR"
      - "cs.DC"
      - "stat.ML"
    lookback_days: 730

  semantic_scholar:
    enabled: true
    base_url: "https://api.semanticscholar.org/graph/v1/paper/search"
    limit_per_query: 10
    fields: "title,year,url,abstract,externalIds,authors,venue,journal,publicationDate,citationCount"

  openreview:
    enabled: true
    base_url: "https://api2.openreview.net/notes/search"
    limit_per_query: 10

# ============================================================
# 通知配置 (错误时)
# ============================================================
notifications:
  enabled: true
  log_file: "C:/Users/Leo/Documents/PaperAutomation/logs/automation.log"
  # Windows event log or popup
  method: "log"  # log, toast, both

# ============================================================
# 调试
# ============================================================
debug: false
